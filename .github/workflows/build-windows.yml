name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --onefile --windowed --name PudufuLiveSetup
          --add-data "assets;assets" --add-data "template;template"
          setup_live.py
      - uses: actions/upload-artifact@v4
        with:
          name: PudufuLiveSetup
          path: dist/PudufuLiveSetup.exe
